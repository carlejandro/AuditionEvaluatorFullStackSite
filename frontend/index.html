<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audition Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <h1>Audition Tracker</h1>

        <div class="main-layout">
            <div class="panel">
                <h2>Performers</h2>
                <div id="performer-list"></div>
            </div>

            <div class="panel" id="performer-detail">
                <h2>Selected Performer</h2>
                <p>Click a performer to view details</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
